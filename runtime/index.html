<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SwCreator application preview</title>
<style>
html,body { margin:0; width:100%; height:100%; overflow:hidden; background:transparent; }
#status { display:inline-block; color:#181c24; background:#eef1f5; font:14px system-ui; padding:14px; }
#status[hidden] { display:none; }
body.core { overflow:auto; background:#131823; color:#edf2fa; font:14px system-ui; }
body.core #status { display:block; color:inherit; background:transparent; border-bottom:1px solid #30394c; }
#output { padding:14px; margin:0; white-space:pre-wrap; overflow-wrap:anywhere; }
</style>
<div id="status">Loading application runtime…</div>
<pre id="output" hidden></pre>
<script src="SwCreatorWebRuntime.js"></script>
<script>
(() => {
  const status = document.getElementById('status');
  const output = document.getElementById('output');
  const reply = (message) => parent.postMessage(message, location.origin);
  let generation = 0;
  let core = false;
  const print = (text, stream) => {
    if (core) output.textContent += text + '\n';
    reply({ type: 'swcreator:preview-output', text, stream });
  };
  const runtime = SwCreatorRuntime({
    locateFile: (name) => new URL(name, location.href).href,
    print: (text) => print(text, 'stdout'),
    printErr: (text) => print(text, 'stderr')
  }).then((module) => {
    module.creatorPendingProjects = [];
    module.creatorProjectClosed = () => reply({ type: 'swcreator:preview-closed' });
    module.creatorProjectExited = (code) => {
      status.hidden = false;
      status.textContent = 'Exited with code ' + code;
      reply({ type: 'swcreator:preview-exited', code });
    };
    module.creatorProjectMounted = (project, result) => {
      status.hidden = !core && result === 0;
      if (!result && core) status.textContent = 'Core application running';
      if (result) status.textContent = 'Could not start the compiled application.';
      reply({ type: 'swcreator:preview-result', id: project.id, ok: result === 0,
        error: result ? 'The runtime could not mount the project (' + result + ').' : undefined });
    };
    status.hidden = true;
    reply({ type: 'swcreator:preview-ready' });
    return module;
  });
  runtime.catch((error) => {
    status.textContent = error.message;
    reply({ type: 'swcreator:preview-result', ok: false, error: error.message });
  });
  addEventListener('message', async (event) => {
    if (event.source !== parent || event.origin !== location.origin) return;
    const message = event.data;
    if (!message || message.type !== 'swcreator:run') return;
    core = message.projectProfile === 'core';
    document.body.classList.toggle('core', core);
    output.hidden = !core;
    output.textContent = '';
    const bytes = message.wasm instanceof ArrayBuffer ? new Uint8Array(message.wasm) : message.wasm;
    if (!(bytes instanceof Uint8Array) || bytes.length < 8 || bytes[0] !== 0 || bytes[1] !== 97 ||
        bytes[2] !== 115 || bytes[3] !== 109) {
      reply({ type: 'swcreator:preview-result', id: message.id, ok: false, error: 'Invalid WebAssembly module.' });
      return;
    }
    try {
      const module = await runtime;
      const path = '/creator-project-' + (++generation) + '.wasm';
      module.FS.writeFile(path, bytes);
      await module.loadDynamicLibrary(path, { loadAsync: true, global: true, nodelete: true });
      module.creatorPendingProjects.push({ path, id: message.id, formSize: message.formSize,
        projectProfile: message.projectProfile });
    } catch (error) {
      status.hidden = false;
      status.textContent = error.message;
      reply({ type: 'swcreator:preview-result', id: message.id, ok: false, error: error.message });
    }
  });
})();
</script>
</html>
