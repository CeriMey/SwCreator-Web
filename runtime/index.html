<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SwCreator application preview</title>
<style>
html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#15191f; }
#status { color:#a9b2c0; font:14px system-ui; padding:14px; }
</style>
<div id="status">Loading application runtime…</div>
<script src="SwCreatorWebRuntime.js"></script>
<script>
(() => {
  const status = document.getElementById('status');
  const reply = (message) => parent.postMessage(message, location.origin);
  let generation = 0;
  const runtime = SwCreatorRuntime({
    locateFile: (name) => new URL(name, location.href).href,
    print: (text) => reply({ type: 'swcreator:preview-output', text, stream: 'stdout' }),
    printErr: (text) => reply({ type: 'swcreator:preview-output', text, stream: 'stderr' })
  }).then((module) => {
    module.creatorPendingProjects = [];
    module.creatorProjectMounted = (project, result) => {
      status.hidden = result === 0;
      if (result) status.textContent = 'Could not start the compiled application.';
      reply({ type: 'swcreator:preview-result', id: project.id, ok: result === 0,
        error: result ? 'The runtime could not mount the project (' + result + ').' : undefined });
    };
    status.hidden = true;
    reply({ type: 'swcreator:preview-ready' });
    return module;
  });
  runtime.catch((error) => {
    status.textContent = error.message;
    reply({ type: 'swcreator:preview-result', ok: false, error: error.message });
  });
  addEventListener('message', async (event) => {
    if (event.source !== parent || event.origin !== location.origin) return;
    const message = event.data;
    if (!message || message.type !== 'swcreator:run') return;
    const bytes = message.wasm instanceof ArrayBuffer ? new Uint8Array(message.wasm) : message.wasm;
    if (!(bytes instanceof Uint8Array) || bytes.length < 8 || bytes[0] !== 0 || bytes[1] !== 97 ||
        bytes[2] !== 115 || bytes[3] !== 109) {
      reply({ type: 'swcreator:preview-result', id: message.id, ok: false, error: 'Invalid WebAssembly module.' });
      return;
    }
    try {
      const module = await runtime;
      const path = '/creator-project-' + (++generation) + '.wasm';
      module.FS.writeFile(path, bytes);
      await module.loadDynamicLibrary(path, { loadAsync: true, global: true, nodelete: true });
      module.creatorPendingProjects.push({ path, id: message.id });
    } catch (error) {
      status.hidden = false;
      status.textContent = error.message;
      reply({ type: 'swcreator:preview-result', id: message.id, ok: false, error: error.message });
    }
  });
})();
</script>
</html>
