<h1>Diagnostic de connexion Softi</h1>
<p>Cette vérification ouvre Softi dans un onglet et contrôle l’extension, le profil Claude et les catalogues utilisés par l’assistant. Aucun message n’est envoyé aux modèles et aucun jeton n’est inclus dans le rapport.</p>
<button id="run">Vérifier les connexions</button>
<button id="copy" disabled>Copier le diagnostic</button>
<p id="status" role="status">Prêt à vérifier.</p>
<pre id="report" hidden></pre>
<p><a id="open" href="SwCreatorWeb.html">Ouvrir Softi</a></p>
